site_name: Tridim Business Platform
site_description: Public product information and documentation for Tridim Business.
site_url: https://tridim-technologies.github.io/tridim-business-docs/
repo_url: https://github.com/Tridim-Technologies/tridim-business-docs
repo_name: Tridim-Technologies/tridim-business-docs
docs_dir: site-docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/api-explorer.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Architecture: architecture.md
  - API explorer: api-explorer.md
  - Product:
      - Workflow: product/workflow.md
      - Capabilities: product/capabilities.md
      - Security and data: product/security-and-data.md
  - Guides:
      - Sales and delivery: guides/sales-and-delivery.md
      - Time and expenses: guides/time-and-expenses.md
      - Finance operations: guides/finance-operations.md
  - Current status: status.md
  - GitHub: https://github.com/Tridim-Technologies/tridim-business
